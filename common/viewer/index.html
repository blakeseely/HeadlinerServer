<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Headliners — Show Extraction Review</title>
<style>
  :root{--bg:#0f1115;--panel:#171a21;--panel2:#1e232c;--text:#e8eaf0;--mut:#9aa3b2;
        --acc:#4f8cff;--ok:#39d98a;--warn:#ffb347;--bad:#ff5d5d;--line:#2a313d;
        --c-music:#4f8cff;--c-film:#c792ea;--c-comedy:#ffb347;--c-other:#8b96a8}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       background:var(--bg);color:var(--text);line-height:1.45}
  header{position:sticky;top:0;z-index:10;background:rgba(15,17,21,.92);backdrop-filter:blur(8px);
         border-bottom:1px solid var(--line);padding:12px 22px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  header h1{font-size:18px;margin:0}
  header .sub{color:var(--mut);font-size:12px}
  .spacer{flex:1}
  .stat{font-size:12px;color:var(--mut);background:var(--panel);border:1px solid var(--line);
        padding:6px 10px;border-radius:8px}
  .stat b{color:var(--text)}
  .search{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:8px;
          padding:7px 10px;font-size:13px;width:200px}
  select{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:7px 10px;font-size:13px}
  .layout{display:grid;grid-template-columns:minmax(280px,1fr) minmax(360px,1.4fr);gap:0;height:calc(100vh - 58px)}
  .col{overflow:auto}
  .list{border-right:1px solid var(--line);background:var(--panel)}
  .detail{background:var(--bg)}
  .item{padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer;border-left:3px solid transparent}
  .item:hover{background:var(--panel2)}
  .item.active{background:var(--panel2);border-left-color:var(--acc)}
  .item .name{font-weight:600;font-size:14px}
  .item .meta{font-size:12px;color:var(--mut);margin-top:2px}
  .month-h{position:sticky;top:0;background:var(--panel);padding:8px 14px;font-size:12px;letter-spacing:.08em;
           color:var(--acc);font-weight:700;border-bottom:1px solid var(--line);z-index:2}
  .flag{font-size:11px;padding:1px 6px;border-radius:6px;margin-left:6px}
  .flag.ok{background:rgba(57,217,138,.15);color:var(--ok)}
  .flag.warn{background:rgba(255,179,71,.18);color:var(--warn)}
  .flag.bad{background:rgba(255,93,93,.18);color:var(--bad)}
  .dhead{padding:20px 24px 8px;border-bottom:1px solid var(--line)}
  .dhead h2{margin:0;font-size:22px}
  .dhead .bill{font-size:14px;color:var(--mut);margin-top:4px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin:16px 24px}
  .card h3{margin:0 0 12px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--acc)}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .lbl{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin-bottom:5px}
  .val{font-size:15px;font-weight:600}
  .val.miss{color:var(--warn);font-style:italic}
  .match{font-size:11px;padding:1px 6px;border-radius:6px;margin-left:6px}
  .match.ok{background:rgba(57,217,138,.15);color:var(--ok)}
  .match.warn{background:rgba(255,179,71,.18);color:var(--warn)}
  .match.bad{background:rgba(255,93,93,.18);color:var(--bad)}
  a.btn{display:inline-block;margin-top:12px;background:var(--acc);color:#fff;text-decoration:none;
        padding:9px 16px;border-radius:8px;font-size:13px;font-weight:600}
  a.plain{color:var(--acc);font-size:12px;text-decoration:none}
  .sp-tag{font-size:11px;margin-left:4px;vertical-align:1px;text-decoration:none}
  .sp-tag:hover{opacity:.8}
  .sp-pills{display:inline-flex;gap:5px;margin-left:8px;vertical-align:2px}
  .sp-pill{font-size:12px;font-weight:600;line-height:1.1;padding:3px 9px;border-radius:10px;
           text-decoration:none;white-space:nowrap}
  .sp-pill:hover{opacity:.82}
  .sp-pill.apple{background:rgba(255,93,93,.18);color:#ff6b6b;border:1px solid rgba(255,93,93,.5)}
  .sp-pill.spotify{background:rgba(57,217,138,.18);color:#4be09a;border:1px solid rgba(57,217,138,.5)}
  .empty{padding:40px;color:var(--mut);text-align:center}
  .legend{padding:10px 24px;font-size:12px;color:var(--mut)}
  .chip{display:inline-block;background:var(--panel2);border:1px solid var(--line);border-radius:6px;
        padding:2px 8px;margin:2px 4px 2px 0;font-size:12px}
  .chip.multi{background:rgba(255,179,71,.14);border-color:var(--warn);color:var(--warn)}
  a.chip{color:var(--acc);text-decoration:none;border-color:rgba(79,140,255,.45)}
  a.chip:hover{background:rgba(79,140,255,.14)}
  .chip.nf{opacity:.6;border-style:dashed}
  .chip.close{color:var(--acc);border-color:rgba(79,140,255,.4)}
  .chip.review{color:var(--warn);border-color:rgba(255,179,71,.5);border-style:dashed}
  .nf-tag{font-size:10px;color:var(--mut);margin-left:4px;text-transform:uppercase;letter-spacing:.04em}
  .desc{font-size:13px;color:var(--mut);white-space:pre-wrap;max-height:220px;overflow:auto;margin-top:4px}
  .cat{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
       padding:2px 9px;border-radius:20px;border:1px solid transparent;vertical-align:middle;margin-left:8px}
  .cat.music{color:var(--c-music);background:rgba(79,140,255,.14);border-color:rgba(79,140,255,.4)}
  .cat.film{color:var(--c-film);background:rgba(199,146,234,.14);border-color:rgba(199,146,234,.4)}
  .cat.comedy{color:var(--c-comedy);background:rgba(255,179,71,.14);border-color:rgba(255,179,71,.4)}
  .cat.other{color:var(--c-other);background:rgba(139,150,168,.14);border-color:rgba(139,150,168,.4)}
  .catglyph{font-size:13px;margin-right:2px}
  @media(max-width:760px){.layout{grid-template-columns:1fr;height:auto}.col{max-height:50vh}}
</style>
</head>
<body>
<header>
  <div>
    <h1 id="vname">Headliners</h1>
    <div class="sub" id="srcsub"></div>
  </div>
  <div class="spacer"></div>
  <a class="plain" href="/">‹ all venues</a>
  <input class="search" id="search" placeholder="Filter shows…">
  <select id="catf"></select>
  <select id="status"><option value="">All status</option>
    <option value="ok">✓ complete</option><option value="warn">⚠ review</option><option value="bad">✗ issue</option></select>
  <span class="stat" id="stat"></span>
  <span class="stat" id="amstat"></span>
  <span class="stat" id="spstat"></span>
  <a class="plain" id="raw" target="_blank">view JSON</a>
</header>
<div class="layout">
  <div class="col list" id="list"></div>
  <div class="col detail" id="detail"><div class="empty">Select a show on the left to review the extraction.</div></div>
</div>
<script>
/*__SHOWS_PAYLOAD__*/
const DATA = window.SHOWS;
const STATS = DATA.stats || {};
const AM = STATS.apple_music || null;      // independent-style Apple Music block
const TYPES = STATS.event_types || null;   // castro-style category counts
const HAS_AM = !!AM;
const MONTHS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const MONFULL=["January","February","March","April","May","June","July","August","September","October","November","December"];
const CATGLYPH = {music:"♪", film:"🎬", comedy:"😄", other:"◆"};
let cur=null, filter="", status="", cat="";

function statusOf(s){
  const miss=[];
  if(!s.date) miss.push("date");
  if(!s.headline_artists||!s.headline_artists.length) miss.push("headliner");
  if(!s.ticket_link && s.ticket_status!=="sold out") miss.push("tickets");
  if(s.needs_review) miss.push("needs review");
  if(!miss.length) return {cls:"ok",label:"complete"};
  if(miss.includes("headliner")||miss.includes("date")) return {cls:"bad",label:miss.join(", ")};
  return {cls:"warn",label:miss.join(", ")};
}
function esc(x){return (x==null?"":String(x)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
const aname=a=> (a && typeof a==="object") ? a.name : String(a);
const anames=a=> (a||[]).map(aname).join(" / ");
// One artist chip. detail=true (the detail pane): the name is PLAIN text and
// the Apple Music / Spotify links are separate pills (red / green), each
// omitted when absent. Otherwise (the list) it's the original clickable chip
// with a confidence tag and an inline 🎧.
function achip(a, supp, detail){
  const name=aname(a);
  const isObj=(a&&typeof a==="object");
  const link=isObj? a.apple_music : null;
  const sp=isObj? a.spotify : null;
  const found=isObj? !!a.apple_music : null;
  const conf=isObj? a.confidence : null;
  const label=isObj? a.apple_label : null;
  const multi=name.startsWith("(");

  if(detail){
    let pills="";
    let tip=name;
    if(HAS_AM && link){
      let lt="Apple Music";
      if(label) lt="Apple Music: "+label;
      else if(conf!=null&&conf<0.8) lt="Apple Music — close match, verified";
      else if(conf!=null&&conf<1) lt="Apple Music — near match, review";
      pills+=`<a class="sp-pill apple" href="${esc(link)}" target="_blank" title="${esc(lt)}">Apple Music</a>`;
    }
    if(sp){
      const st=isObj? a.spotify_source : null;
      let stt=st==="api"?"Spotify (searched)":st==="venue"?"Spotify (venue site)":"Spotify";
      pills+=`<a class="sp-pill spotify" href="${esc(sp)}" target="_blank" title="${esc(stt)}">Spotify</a>`;
    }
    if(!pills && !found && HAS_AM && isObj && (link||!a.spotify))
      tip="No confident Apple Music match";
    if(!pills) return `<span class="chip${multi?" multi":""}" title="${esc(tip)}">${esc(name)}</span>`;
    return `<span class="chip${multi?" multi":""}"><span>${esc(name)}</span><span class="sp-pills">${pills}</span></span>`;
  }

  let cls="chip"+(multi?" multi":"");
  let tag="", tip=name;
  if(HAS_AM && isObj){
    const tier=(conf==null)?(found?1:0):(conf>=1?1:(conf>=0.8?2:(conf>=0.7?3:0)));
    if(tier===2){cls+=" close";tip="Apple Music — close match, verified";}
    else if(tier===3){cls+=" review";tip="Apple Music — needs review";}
    else if(tier===0){cls+=" nf";tip="No confident Apple Music match";}
    else tip="Apple Music — exact match";
    if(label) tip="Apple Music: "+label;
    const pct=found?Math.round((conf==null?1:conf)*100):0;
    tag=tier===2?" ≈"+pct+"%":(tier===3?" ⚠":(tier===0?' <span class="nf-tag">not found</span>':""));
  }
  // the venue-published Spotify link (scraped from the site) — shows even
  // when there's no Apple Music match. Never a lookup, so no confidence tag.
  let spot=sp?` <a class="sp-tag" href="${esc(sp)}" target="_blank" title="Spotify (from the venue's site)">🎧</a>`:"";
  if(sp && !link && !found) tip="Spotify link only (venue site)";
  if(found && link) return `<a class="${cls}" href="${esc(link)}" target="_blank" title="${esc(tip)}">${esc(name)}${tag}${spot}</a>`;
  return `<span class="${cls}" title="${esc(tip)}">${esc(name)}${tag}${spot}</span>`;
}
const chips=(a,supp)=> (a||[]).map(x=>achip(x,supp,true)).join("");

function renderList(){
  const list=document.getElementById("list");
  const f=filter.toLowerCase(), st=status, c=cat;
  let html="", lastMonth="", n=0;
  for(const s of DATA.shows){
    if(f && !JSON.stringify([s.headline_artists,s.support_artists,(s.show_title||""),(s.note||"")]).toLowerCase().includes(f)) continue;
    if(c && s.event_type!==c) continue;
    if(st){const stt=statusOf(s).cls; if(stt!==st) continue;}
    n++;
    const mkey=s.date? s.date.slice(0,4)+"-"+s.date.slice(5,7):"????";
    if(mkey!==lastMonth){
      lastMonth=mkey;
      html+=`<div class="month-h">${s.date?MONFULL[parseInt(s.date.slice(5,7))-1]+" "+s.date.slice(0,4):"No date"}</div>`;
    }
    const stt=statusOf(s);
    const nm=anames(s.headline_artists);
    const sup=anames(s.support_artists);
    const g=s.event_type? `<span class="catglyph">${CATGLYPH[s.event_type]||""}</span> `:"";
    const nf=(HAS_AM && (s.headline_artists||[]).concat(s.support_artists||[]).some(a=>aname(a)&&!(a&&a.apple_music)))?'<span class="nf-tag">♪ ?</span>':"";
    const rm=s.room?` <span class="cat" style="opacity:.8">▸ ${esc(s.room)}</span>`:"";
    html+=`<div class="item ${cur===s? 'active':''}" data-id="${DATA.shows.indexOf(s)}">
      <div class="name">${g}${esc(nm)} ${rm} <span class="flag ${stt.cls}">${stt.cls==='ok'?'✓':(stt.cls==='warn'?'⚠':'✗')}</span></div>
      <div class="meta">${s.date||'?'} ${s.show_time||''}${sup? ' · +'+esc(sup):''} ${s.show_title?' · '+esc(s.show_title):''} ${nf}</div>
    </div>`;
  }
  if(!n) html=`<div class="empty">No shows match.</div>`;
  list.innerHTML=html;
  list.querySelectorAll(".item").forEach(el=>el.onclick=()=>select(parseInt(el.dataset.id)));
  document.getElementById("stat").innerHTML=`<b>${n}</b> of ${DATA.shows.length} shows`;
}

function select(i){ cur=i; renderList(); renderDetail(); }

function renderDetail(){
  const d=document.getElementById("detail");
  if(cur==null){d.innerHTML=`<div class="empty">Select a show on the left to review the extraction.</div>`;return;}
  const s=DATA.shows[cur];
  const stt=statusOf(s);
  const head=(s.headline_artists||[]).map(a=>achip(a,false,true)).join("")||`<span class="val miss">— missing —</span>`;
  const sup=(s.support_artists&&s.support_artists.length)?chips(s.support_artists,true):`<span class="val miss">— none listed —</span>`;
  const title=s.show_title?`<div class="val">${esc(s.show_title)}</div>`:"";
  const pres=(s.presenters&&s.presenters.length)?s.presenters.map(a=>`<span class="chip">${esc(a)}</span>`).join(""):"";
  const fmt=s.set_format?`<span style="font-size:13px;color:var(--mut)">(${esc(s.set_format)})</span>`:"";
  const note=s.note?`<p style="font-size:12px;color:var(--warn);margin:10px 0 0">⚠ ${esc(s.note)}</p>`:"";
  const desc=s.description?`<div class="lbl" style="margin-top:12px">Description (from site)</div><div class="desc">${esc(s.description)}</div>`:"";
  const row=(lbl,val)=>`<div><div class="lbl">${lbl}</div><div class="val ${val?"":"miss"}">${esc(val)||"—"}</div></div>`;
  const ticketVal=s.ticket_status||(s.ticket_link?"available":"");
  const tick=ticketVal?`<span class="match ${ticketVal.toLowerCase().includes("sold")?"bad":"ok"}">${esc(ticketVal)}</span>`:"";
  const catChip=s.event_type?`<span class="cat ${s.event_type}">${s.event_type}</span>`:"";
  d.innerHTML=`
   <div class="dhead">
     <h2>${esc(anames(s.headline_artists)||"?")} ${fmt} ${catChip}</h2>
     <div class="bill">${esc(s.show_title||"")}</div>
   </div>
   <div class="legend">Extraction status: <span class="flag ${stt.cls}">${stt.cls==='ok'?'✓ complete':(stt.cls==='warn'?'⚠':'✗')}</span>
     ${stt.label!=='complete'?('— '+esc(stt.label)):''}</div>
   <div class="card"><h3>My extraction</h3>
     <div class="grid">
       <div><div class="lbl">Headliner(s)</div>${head}</div>
       <div><div class="lbl">Support</div>${sup}</div>
       ${title?`<div><div class="lbl">Show / Tour title</div>${title}</div>`:""}
       ${pres?`<div><div class="lbl">Presenter</div>${pres}</div>`:""}
       ${row("Date", s.date||"")} ${row("Doors", s.doors||"")}
       ${row("Show time", s.show_time||"")}
       ${ticketVal?`<div><div class="lbl">Tickets</div><div class="val ${ticketVal?"":"miss"}">${tick}</div></div>`:""}
       ${s.room?row("Room", s.room):""} ${s.age_rating?row("Ages", s.age_rating):""}
     </div>
     ${note} ${desc}
     ${(s.ticket_link||s.event_page)?`<div>
       ${s.ticket_link?`<a class="btn" target="_blank" href="${esc(s.ticket_link)}">Buy tickets →</a>`:""}
       ${s.event_page?`<a class="plain" target="_blank" href="${esc(s.event_page)}" style="margin-left:10px">Open on website →</a>`:""}
     </div>`:""}
   </div>
   <div class="card"><h3>Verify against the source</h3>
     <div class="grid">
       ${row("Date on site","open page")} ${row("Times on site","open page")}
       ${row("Support on site","open page")} ${row("Ticket status on site","open page")}
     </div>
     ${s.event_page?`<a class="btn" target="_blank" href="${esc(s.event_page)}">Open source event page →</a>`:""}
     <p style="font-size:12px;color:var(--mut);margin-top:12px">
       Compare the values above to the source page. ${s.event_type?("The type ("+s.event_type+") is derived from the page text — flag anything mislabeled. "):""}
       If anything differs (an artist, a time, a link), tell me and I'll correct the extraction.</p>
   </div>`;
}

document.getElementById("search").oninput=e=>{filter=e.target.value;renderList();};
document.getElementById("status").onchange=e=>{status=e.target.value;renderList();};
document.getElementById("srcsub").textContent=`${DATA.venue} · ${DATA.count} shows · source ${DATA.source_url} · captured ${DATA.scraped_at}`;
document.getElementById("vname").textContent=DATA.venue;
document.getElementById("raw").href="shows.json";
if(HAS_AM){
  const a=AM;
  document.getElementById("amstat").innerHTML=`♪ Apple Music: <b>${a.exact}</b> exact · <b>${a.close}</b> close · ${a.flagged||0} flagged · <b>${a.not_found}</b> not found (of ${a.unique_artists})`;
} else {
  document.getElementById("amstat").style.display="none";
}
// Spotify stat line: worded by source — venue-published links, API-searched
// links, feed-carried links, or a mix.
const SPB=STATS.spotify||{};
if(SPB.linked){
  let note="";
  const parts=[];
  if(SPB.venue) parts.push(`${SPB.venue} venue`);
  if(SPB.api) parts.push(`${SPB.api} Spotify search`);
  if(SPB.feed) parts.push(`${SPB.feed} feed`);
  if(parts.length) note=` (${parts.join(" · ")})`;
  document.getElementById("spstat").innerHTML=`🎧 Spotify: <b>${SPB.linked}</b> linked${note}`;
} else {
  document.getElementById("spstat").style.display="none";
}
// type filter — only for venues whose schedule actually mixes types
const catf=document.getElementById("catf");
const nonzeroTypes=Object.keys(TYPES||{}).filter(c=>TYPES[c]>0);
if(TYPES && nonzeroTypes.length>1){
  catf.innerHTML='<option value="">All types</option>'+nonzeroTypes.map(c=>`<option value="${c}">${c}</option>`).join("");
  catf.onchange=e=>{cat=e.target.value;renderList();};
} else catf.style.display="none";
renderList();
</script>
</body>
</html>
